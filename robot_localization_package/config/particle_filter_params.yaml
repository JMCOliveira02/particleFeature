particle_filter:
  ros__parameters:
    # PARTICLE COUNT - Much higher for extreme robustness
    num_particles: 20000.0       
    
    # MOTION MODEL - HYPER AGGRESSIVE for max convergence
    motion_delta_distance: 0.01          # � HYPER: Update every 1mm!
    motion_delta_angle: 0.01             # � HYPER: Update every 0.06 degrees!
    motion_x_variance: 0.002               # � HYPER: Extremely tight motion model
    motion_y_variance: 0.002                # � HYPER: Extremely tight motion model
    motion_angle_variance: 0.002          # � HYPER: Extremely tight angular model
    
    # RESAMPLING - HYPER AGGRESSIVE for fastest convergence
    resample_ess_threshold: 0.5           # � HYPER: Resample when ESS < 80%!!
    
    # INJECTION - HYPER AGGRESSIVE 
    inject_num_iterations: 20                # � HYPER: Inject almost every iteration!
    inject_percentage: 0.01                 # � HYPER: Massive 15% injection!
    replace_worst_percentage: 0.01          # � HYPER: Replace 15% worst particles!
    
    # POSE ESTIMATION - Use fewer but best particles for fast convergence
    estimate_num_particles: 200              # � HYPER: Use only best particles